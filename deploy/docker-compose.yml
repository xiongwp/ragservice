# docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: rag

services:
  mysql:
    image: mysql:8.4
    command: ["--max-allowed-packet=256M"]   # uploads up to RAG_MAX_UPLOAD_MB are stored as one row
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rag}
    ports:
      - "3307:3306"   # 3307 so it does not collide with a local MySQL
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      # Over TCP: during first-start initialisation MySQL runs a temporary
      # server without networking, which a socket ping would report healthy.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -urag -p$${MYSQL_PASSWORD} --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST + web UI (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC, used by ragd
    volumes:
      - qdrantdata:/qdrant/storage

  # Parses pdf/docx/pptx/xlsx. The image is several GB; txt/md/html work without it.
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"

  ragd:
    build:
      context: ..
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      RAG_MYSQL_DSN: rag:${MYSQL_PASSWORD:-rag}@tcp(mysql:3306)/rag
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      DOCLING_URL: http://docling:5001
      RAG_API_KEYS: ${RAG_API_KEYS:?set RAG_API_KEYS in .env}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_RPS: ${EMBEDDING_RPS:-10}
      EMBEDDING_CONCURRENCY: ${EMBEDDING_CONCURRENCY:-4}
      RAG_WORKERS: ${RAG_WORKERS:-4}
      RAG_SEARCH_MODE: ${RAG_SEARCH_MODE:-hybrid}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-${EMBEDDING_API_KEY:-}}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_FORMAT: ${RERANK_FORMAT:-cohere}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-${EMBEDDING_API_KEY:-}}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      RAG_QUERY_REWRITE: ${RAG_QUERY_REWRITE:-off}
    restart: unless-stopped

volumes:
  mysqldata:
  qdrantdata:
